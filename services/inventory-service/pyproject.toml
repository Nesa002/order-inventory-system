[project]
name = "inventory-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "order-events-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service"]

[tool.hatch.metadata]
allow-direct-references = true